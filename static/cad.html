<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboLab CAD Workspace</title><link rel="stylesheet" href="/static/workspace.css"></head><body><div class="workspace"><header class="topbar"><div class="brand"><div class="logo">RX</div><div><b>RoboLab</b><small>CAD Workspace</small></div></div><a class="back" href="/">← RoboLab Home</a></header><aside class="sidebar"><div class="side-title">WORKSPACES</div><a class="side-link" href="/static/builder.html">🧠 AI Builder</a><a class="side-link" href="/static/circuit.html">⚡ Circuit</a><a class="side-link" href="/static/code.html">💻 Code</a><a class="side-link" href="/static/simulator.html">🧪 Simulator</a><a class="side-link active" href="/static/cad.html">📐 CAD</a><div class="side-title">PROJECT</div><a class="side-link" href="/">← Home</a></aside><main class="main"><span class="eyebrow">CAD ENGINE</span><h1 class="title">Design your robot</h1><p class="subtitle">Generate OpenSCAD geometry from your project description.</p><section class="panel"><textarea id="project" placeholder="Describe the part or robot chassis you want..."></textarea><br><br><button class="btn primary" id="generate">Generate CAD</button></section><section class="panel"><div class="toolbar"><b>OpenSCAD output</b><button class="btn" id="download">Download .scad</button></div><pre id="out" class="code">Your generated CAD code will appear here.</pre></section></main></div><script>const p=document.getElementById('project'),o=document.getElementById('out');let code='';document.getElementById('generate').onclick=async()=>{const r=await fetch('/api/cad',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:p.value||'robot chassis'})});const d=await r.json();code=d.code;o.textContent=code};document.getElementById('download').onclick=()=>{if(!code)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'}));a.download='robolab_generated.scad';a.click()};</script></body></html>
