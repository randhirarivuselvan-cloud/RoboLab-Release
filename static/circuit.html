<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboLab Circuit Workspace</title><link rel="stylesheet" href="/static/workspace.css"></head><body><div class="workspace"><header class="topbar"><div class="brand"><div class="logo">RX</div><div><b>RoboLab</b><small>Circuit Workspace</small></div></div><a class="back" href="/">← RoboLab Home</a></header><aside class="sidebar"><div class="side-title">WORKSPACES</div><a class="side-link" href="/static/builder.html">🧠 AI Builder</a><a class="side-link active" href="/static/circuit.html">⚡ Circuit</a><a class="side-link" href="/static/code.html">💻 Code</a><a class="side-link" href="/static/simulator.html">🧪 Simulator</a><a class="side-link" href="/static/cad.html">📐 CAD</a></aside><main class="main"><span class="eyebrow">CIRCUIT ENGINE</span><h1 class="title">Build the wiring</h1><p class="subtitle">Generate a visual wiring overview from your project.</p><section class="panel"><textarea id="project" placeholder="Describe your robot and components..."></textarea><br><br><button class="btn primary" id="generate">Generate circuit</button></section><section class="panel"><div id="out" class="canvas-wrap">Your circuit will appear here.</div></section></main></div><script>document.getElementById('generate').onclick=async()=>{const r=await fetch('/api/circuit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:document.getElementById('project').value||'robot'})});document.getElementById('out').innerHTML=await r.text()};</script></body></html>
