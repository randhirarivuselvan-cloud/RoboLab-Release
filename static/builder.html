<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboLab AI Builder</title><link rel="stylesheet" href="/static/workspace.css"></head><body><div class="workspace"><header class="topbar"><div class="brand"><div class="logo">RX</div><div><b>RoboLab</b><small>AI Builder Workspace</small></div></div><a class="back" href="/">← RoboLab Home</a></header><aside class="sidebar"><div class="side-title">WORKSPACES</div><a class="side-link active" href="/static/builder.html">🧠 AI Builder</a><a class="side-link" href="/static/circuit.html">⚡ Circuit</a><a class="side-link" href="/static/code.html">💻 Code</a><a class="side-link" href="/static/simulator.html">🧪 Simulator</a><a class="side-link" href="/static/cad.html">📐 CAD</a></aside><main class="main"><span class="eyebrow">BUILDER ENGINE</span><h1 class="title">Describe anything you want to build</h1><p class="subtitle">RoboLab turns natural language into a structured engineering plan.</p><section class="panel"><textarea id="prompt" placeholder="Example: Build an obstacle avoiding robot with Arduino Uno, ultrasonic sensor and two motors under ₹3000"></textarea><br><br><input id="budget" class="input" type="number" placeholder="Budget in ₹ (optional)"><br><br><button class="btn primary" id="plan">Generate engineering plan</button></section><section id="result" class="panel"><span class="muted">Your engineering plan will appear here.</span></section></main></div><script>document.getElementById('plan').onclick=async()=>{const r=await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:document.getElementById('prompt').value,budget:document.getElementById('budget').value})});const d=await r.json();document.getElementById('result').innerHTML='<h2>'+d.project+'</h2><p><b>Estimated total:</b> ₹'+d.total_estimate.toLocaleString('en-IN')+'</p><div class="grid">'+d.items.map(i=>'<div class="panel"><b>'+i.name+'</b><br><span class="muted">'+i.category+' · Qty '+i.quantity+'</span><br>₹'+i.cost.toLocaleString('en-IN')+'</div>').join('')+'</div><p>'+d.alternatives.join(' ')+'</p>'};</script></body></html>
