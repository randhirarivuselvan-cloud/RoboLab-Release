<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboLab Code Workspace</title><link rel="stylesheet" href="/static/workspace.css"></head><body><div class="workspace"><header class="topbar"><div class="brand"><div class="logo">RX</div><div><b>RoboLab</b><small>Code Workspace</small></div></div><a class="back" href="/">← RoboLab Home</a></header><aside class="sidebar"><div class="side-title">WORKSPACES</div><a class="side-link" href="/static/builder.html">🧠 AI Builder</a><a class="side-link" href="/static/circuit.html">⚡ Circuit</a><a class="side-link active" href="/static/code.html">💻 Code</a><a class="side-link" href="/static/simulator.html">🧪 Simulator</a><a class="side-link" href="/static/cad.html">📐 CAD</a></aside><main class="main"><span class="eyebrow">CODE ENGINE</span><h1 class="title">Generate firmware</h1><p class="subtitle">Turn your project description into Arduino or ESP32 firmware.</p><section class="panel"><textarea id="project" placeholder="Example: obstacle avoiding robot with HC-SR04 and two motors"></textarea><br><br><div class="toolbar"><select id="platform" class="select" style="max-width:220px"><option value="arduino">Arduino</option><option value="esp32">ESP32</option></select><button class="btn primary" id="generate">Generate code</button></div></section><section class="panel"><div class="toolbar"><b>Generated Arduino C++</b><span id="status" class="status"></span></div><pre id="out" class="code">Your actual generated code will appear here.</pre></section></main></div><script>document.getElementById('generate').onclick=async()=>{const b=document.getElementById('generate'),s=document.getElementById('status');b.disabled=true;s.textContent='Generating…';try{const r=await fetch('/api/firmware',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:document.getElementById('platform').value,project:document.getElementById('project').value||'robot project'})});const d=await r.json();document.getElementById('out').textContent=d.code;s.textContent='Ready'}finally{b.disabled=false}};</script></body></html>
