<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboLab Simulator Workspace</title><link rel="stylesheet" href="/static/workspace.css"></head><body><div class="workspace"><header class="topbar"><div class="brand"><div class="logo">RX</div><div><b>RoboLab</b><small>Simulator Workspace</small></div></div><a class="back" href="/">← RoboLab Home</a></header><aside class="sidebar"><div class="side-title">WORKSPACES</div><a class="side-link" href="/static/builder.html">🧠 AI Builder</a><a class="side-link" href="/static/circuit.html">⚡ Circuit</a><a class="side-link" href="/static/code.html">💻 Code</a><a class="side-link active" href="/static/simulator.html">🧪 Simulator</a><a class="side-link" href="/static/cad.html">📐 CAD</a></aside><main class="main"><span class="eyebrow">SIMULATION ENGINE</span><h1 class="title">Test your robot</h1><p class="subtitle">Run a lightweight 2D kinematic planning simulation.</p><section class="panel"><textarea id="project" placeholder="Describe your robot..."></textarea><br><br><button class="btn primary" id="run">Run simulation</button><span id="status" class="muted"></span></section><section class="panel"><div class="canvas-wrap"><canvas id="canvas" width="900" height="430" style="width:100%;max-width:900px"></canvas></div><p class="muted">Planning preview only — not a physics-certified model.</p></section></main></div><script>document.getElementById('run').onclick=async()=>{const s=document.getElementById('status');s.textContent=' Running…';const r=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:document.getElementById('project').value||'robot',duration:10})});const d=await r.json(),c=document.getElementById('canvas'),x=c.getContext('2d'),xs=d.trajectory.x,ys=d.trajectory.y,minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),sx=760/Math.max(.001,maxX-minX),sy=330/Math.max(.001,maxY-minY);x.clearRect(0,0,c.width,c.height);x.beginPath();xs.forEach((v,i)=>{const px=70+(v-minX)*sx,py=380-(ys[i]-minY)*sy;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();s.textContent=' Complete'};</script></body></html>
